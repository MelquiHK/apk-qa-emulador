name: Explorar MAPS.ME a fondo en emulador

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL publica del APK a probar"
        required: true
        default: "https://d.apkpure.net/b/APK/com.mapswithme.maps.pro?version=latest"
      paquete:
        description: "Package de la app"
        required: true
        default: "com.mapswithme.maps.pro"
      actividad:
        description: "Actividad principal (no se usa, se abre con monkey)"
        required: true
        default: ".DownloadResourcesActivity"

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "SIN /dev/kvm"

      - name: Bajar el APK
        run: |
          curl -L -o app.apk "${{ inputs.apk_url }}"
          ls -la app.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort | tail -1)
          $AAPT dump badging app.apk | grep -E "package:|sdkVersion|launchable-activity" | tee badging.txt

      - name: Explorar MAPS.ME en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            mkdir -p shots
            cp badging.txt shots/ || true
            adb install -r app.apk 2>&1 | tee shots/instalacion.txt
            for p in android.permission.POST_NOTIFICATIONS android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE android.permission.RECORD_AUDIO; do adb shell pm grant "${{ inputs.paquete }}" $p 2>/dev/null; done; echo permisos-ok
            adb emu geo fix -82.3666 23.1136 || true
            adb shell monkey -p "${{ inputs.paquete }}" -c android.intent.category.LAUNCHER 1 2>&1 | tail -2 | tee shots/monkey.txt
            sleep 18
            adb exec-out screencap -p > shots/01-splash.png || true
            adb shell pidof "${{ inputs.paquete }}" > shots/pid.txt || echo "SIN_PROCESO" > shots/pid.txt
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-01.xml > /dev/null 2>&1 || true
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui.xml'],capture_output=True); xml=open('shots/ui.xml',encoding='utf-8').read() if os.path.exists('shots/ui.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Allow\x22[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].', xml)]; t=ms[0] if ms else None; print('permiso Allow ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else None" || true
            sleep 3
            adb exec-out screencap -p > shots/02-tras-permiso.png || true
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui.xml'],capture_output=True); xml=open('shots/ui.xml',encoding='utf-8').read() if os.path.exists('shots/ui.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Next\x22[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].', xml)]; t=ms[0] if ms else None; print('onboarding Next 1 ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else None" || true
            sleep 3
            adb exec-out screencap -p > shots/03-onboarding-p2.png || true
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui.xml'],capture_output=True); xml=open('shots/ui.xml',encoding='utf-8').read() if os.path.exists('shots/ui.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Next\x22[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].', xml)]; t=ms[0] if ms else None; print('onboarding Next 2 ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else None" || true
