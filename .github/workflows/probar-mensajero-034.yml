            python3 tap.py text "Cerrar"
            sleep 2
            for i in 1 2 3 4; do python3 tap.py has "Buscar dirección" | grep -q "SI " && break; adb shell input swipe 540 1550 540 850 300; sleep 1; done
            python3 tap.py edit 0
            sleep 1
