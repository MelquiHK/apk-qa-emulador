            python3 tap.py has "Buscando tu posición" >> shots/checks.txt
            python3 tap.py text "Terminar"
            sleep 2
            python3 tap.py text "Cerrar"
            sleep 2
            for i in 1 2 3 4; do python3 tap.py has "Buscar dirección" | grep -q "SI " && break; adb shell input swipe 360 830 360 500 300; sleep 1; done
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "d entre 21 y 23"
            sleep 1
            adb shell input keyevent 4
            sleep 2
            python3 tap.py text "Buscar"
            sleep 6
