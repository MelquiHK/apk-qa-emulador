name: Probar Mensajero 0.3.4 en emulador (3 tamanos)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL publica del APK a probar"
        required: true
      paquete:
        description: "Package de la app"
        required: true
        default: "com.neocharge.mensajero"
      actividad:
        description: "Actividad principal"
        required: true
        default: ".MainActivity"

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "SIN /dev/kvm"

      - name: Traer tap.py y pinch.py del repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tap.py
            pinch.py
          sparse-checkout-cone-mode: false

      - name: Bajar el APK
        run: |
          curl -L -o app.apk "${{ inputs.apk_url }}"
          ls -la app.apk

      - name: Correr la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            mkdir -p shots
            echo "== INSTALAR ==" > shots/checks.txt
            adb install -r app.apk 2>&1 | tee shots/instalacion.txt
            adb shell pm grant "${{ inputs.paquete }}" android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant "${{ inputs.paquete }}" android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant "${{ inputs.paquete }}" android.permission.POST_NOTIFICATIONS || true
            adb emu geo fix -82.39116 23.13474
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            sleep 3
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 60
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            echo "== LOGIN (1080x2400 por defecto) ==" >> shots/checks.txt
            python3 tap.py shot shots/00-login.png
            python3 tap.py has "Entrar con Google" >> shots/checks.txt
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "mensajero.prueba@neocharge.cu"
            sleep 1
            adb shell input keyevent 4
            sleep 2
            python3 tap.py edit 1
            sleep 1
            python3 tap.py type "NeoPrueba-f89168-26"
            sleep 1
            adb shell input keyevent 4
            sleep 2
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py text "Entrar"
            sleep 5
            python3 tap.py text "Wait"
            sleep 2
            python3 tap.py text "Entrar"
            sleep 15
            python3 tap.py shot shots/00-dentro.png
            python3 tap.py has "Mis entregas de hoy" >> shots/checks.txt
            echo "== BLOQUE POCO: 1220x2712 densidad 446 (el telefono de Mel) ==" >> shots/checks.txt
            adb shell wm size 1220x2712
            adb shell wm density 446
            sleep 2
            adb emu geo fix -82.39116 23.13474
            adb shell am force-stop "${{ inputs.paquete }}"
            sleep 3
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 20
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py has "Mis entregas de hoy" >> shots/checks.txt
            adb shell input swipe 610 1000 610 1900 300
            adb shell input swipe 610 1000 610 1900 300
            sleep 1
            for i in 1 2 3 4; do python3 tap.py has "Tienda" | grep -q "SI " && break; adb shell input swipe 610 1750 610 1000 300; sleep 1; done
            python3 tap.py text "Tienda"
            sleep 16
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py shot shots/poco-previa-0m.png
            python3 tap.py has "Navegación" >> shots/checks.txt
            python3 tap.py has "Distancia: 0 m" >> shots/checks.txt
            python3 tap.py has "Iniciar" >> shots/checks.txt
            python3 tap.py text "Iniciar"
            sleep 9
            python3 tap.py shot shots/poco-siguiendo.png
            python3 tap.py has "km/h" >> shots/checks.txt
            python3 tap.py has "Buscando tu posición" >> shots/checks.txt
            python3 tap.py text "Terminar"
            sleep 2
            python3 tap.py text "Cerrar"
            sleep 2
            for i in 1 2 3 4; do python3 tap.py has "Buscar dirección" | grep -q "SI " && break; adb shell input swipe 610 1750 610 1000 300; sleep 1; done
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "d entre 21 y 23"
            sleep 1
            adb shell input keyevent 4
            sleep 2
            python3 tap.py text "Buscar"
            sleep 6
            python3 tap.py text "Ir"
            sleep 18
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py shot shots/poco-previa-ruta.png
            python3 tap.py has "Distancia:" >> shots/checks.txt
            python3 tap.py has "Iniciar" >> shots/checks.txt
            python3 tap.py text "Iniciar"
            sleep 9
            python3 tap.py shot shots/poco-siguiendo-ruta.png
            python3 tap.py has "Faltan" >> shots/checks.txt
            python3 tap.py has "Buscando tu posición" >> shots/checks.txt
            python3 tap.py text "Terminar"
            sleep 2
            python3 tap.py text "Cerrar"
            sleep 2
            echo "== BLOQUE CHICO: 720x1280 densidad 320 ==" >> shots/checks.txt
            adb shell wm size 720x1280
            adb shell wm density 320
            sleep 2
            adb emu geo fix -82.39116 23.13474
            adb shell am force-stop "${{ inputs.paquete }}"
            sleep 3
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 20
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py has "Mis entregas de hoy" >> shots/checks.txt
            adb shell input swipe 360 500 360 830 300
