            python3 tap.py has "Faltan" >> shots/checks.txt
            python3 tap.py has "Buscando tu posición" >> shots/checks.txt
            python3 tap.py text "Terminar"
            sleep 2
            python3 tap.py text "Cerrar"
            sleep 2
            echo "== BLOQUE MEDIANO: 1080x2400 densidad 420 ==" >> shots/checks.txt
            adb shell wm size 1080x2400
            adb shell wm density 420
            sleep 2
            adb emu geo fix -82.39116 23.13474
            adb shell am force-stop "${{ inputs.paquete }}"
            sleep 3
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 20
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py has "Mis entregas de hoy" >> shots/checks.txt
            adb shell input swipe 540 850 540 1550 300
            adb shell input swipe 540 850 540 1550 300
            sleep 1
            for i in 1 2 3 4; do python3 tap.py has "Tienda" | grep -q "SI " && break; adb shell input swipe 540 1550 540 850 300; sleep 1; done
            python3 tap.py text "Tienda"
            sleep 16
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py shot shots/med-previa-0m.png
            python3 tap.py has "Navegación" >> shots/checks.txt
            python3 tap.py has "Distancia: 0 m" >> shots/checks.txt
            python3 tap.py has "Iniciar" >> shots/checks.txt
            python3 tap.py text "Iniciar"
            sleep 9
            python3 tap.py shot shots/med-siguiendo.png
