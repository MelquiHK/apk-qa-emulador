name: Probar Mensajero 0.5.0b en emulador (giro, brujula, 3D, ajustes)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL publica del APK a probar"
        required: true
      paquete:
        description: "Package de la app"
        required: true
        default: "com.neocharge.mensajero"
      actividad:
        description: "Actividad principal"
        required: true
        default: ".MainActivity"

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "SIN /dev/kvm"

      - name: Traer tap.py del repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tap.py
          sparse-checkout-cone-mode: false

      - name: Bajar el APK
        run: |
          curl -L -o app.apk "${{ inputs.apk_url }}"
          ls -la app.apk

      - name: Correr la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            mkdir -p shots
            echo "== INSTALAR (sobre la 0.5.0 no hace falta: instalacion limpia) ==" > shots/checks.txt
            adb install -r app.apk 2>&1 | tee shots/instalacion.txt
            adb shell pm grant "${{ inputs.paquete }}" android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant "${{ inputs.paquete }}" android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant "${{ inputs.paquete }}" android.permission.POST_NOTIFICATIONS || true
            adb emu geo fix -82.39116 23.13474
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            sleep 3
            adb shell wm size 1220x2712
            adb shell wm density 446
            echo "== (a) MAPA EN EL POCO DE MEL: 1220x2712 ==" >> shots/checks.txt
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 45
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py shot shots/a-mapa-poco.png
            python3 tap.py has "Buscar en Cuba" >> shots/checks.txt
            adb shell wm size 1080x2400
            adb shell wm density 420
            sleep 2
            adb emu geo fix -82.39116 23.13474
            adb shell am force-stop "${{ inputs.paquete }}"
            sleep 3
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 30
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            echo "== (b) CAPAS: ENCENDER EDIFICIOS 3D POR COORDENADAS ==" >> shots/checks.txt
            python3 tap.py desc "Capas"
            sleep 2
            python3 tap.py shot shots/b-capas-antes.png
            adb shell input tap 940 635
            sleep 2
            python3 tap.py shot shots/b-capas-3d.png
            python3 tap.py desc "Cerrar capas"
            sleep 1
            echo "== (c) GIRO POR RUMBO GPS Y BRUJULA ==" >> shots/checks.txt
            adb emu geo fix -82.39116 23.13474 0 12 90
            sleep 1
            python3 tap.py desc "Mi posición"
            sleep 3
            python3 tap.py desc "Mi posición"
            sleep 2
            adb emu geo fix -82.39050 23.13474 0 12 90
            sleep 4
            python3 tap.py shot shots/c-girado.png
            adb shell input tap 975 1148
            sleep 3
            python3 tap.py shot shots/c-norte.png
            adb emu geo fix -82.39116 23.13474
            sleep 1
            echo "== (d) REGLA SIN TARJETA ENCIMA (ARREGLO QA-1) ==" >> shots/checks.txt
            adb shell input swipe 540 1100 540 1100 900
            sleep 2
            python3 tap.py has "Punto marcado en el mapa" >> shots/checks.txt
            python3 tap.py desc "Menú"
            sleep 2
            python3 tap.py text "Medir distancia"
            sleep 2
            adb shell input tap 540 1000
            sleep 1
            adb shell input tap 700 1400
            sleep 2
            python3 tap.py shot shots/d-regla.png
            python3 tap.py has "Medir distancia:" >> shots/checks.txt
            python3 tap.py has "Punto marcado en el mapa" >> shots/checks.txt
            python3 tap.py text "Listo"
            sleep 1
            echo "== (e) NAVEGACION CON 3D Y PERSPECTIVA ==" >> shots/checks.txt
            python3 tap.py textpart "Buscar en Cuba"
            sleep 3
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "d entre 21 y 23"
            sleep 1
            adb shell input keyevent 4
            sleep 1
            python3 tap.py text "Buscar dirección"
            sleep 7
            python3 tap.py text "Ir"
            sleep 3
            python3 tap.py text "Ruta"
            sleep 16
            for i in 1 2 3 4 5 6 7 8; do python3 tap.py has "isn't responding" | grep -q "NO " && break; python3 tap.py text "Wait"; sleep 4; done
            python3 tap.py has "Iniciar" >> shots/checks.txt
            python3 tap.py text "Iniciar"
            sleep 10
            python3 tap.py shot shots/e-siguiendo-3d.png
            python3 tap.py has "km/h" >> shots/checks.txt
            python3 tap.py text "Terminar"
            sleep 2
            python3 tap.py text "Cerrar"
            sleep 2
            echo "== (f) AJUSTES CON SCROLL: NAVEGACION Y ACERCA DE ==" >> shots/checks.txt
            python3 tap.py desc "Menú"
            sleep 2
            python3 tap.py text "Ajustes"
            sleep 3
            adb shell input swipe 540 1800 540 700 400
            sleep 1
            adb shell input swipe 540 1800 540 700 400
            sleep 1
            python3 tap.py shot shots/f-ajustes-nav.png
            python3 tap.py has "Voz de navegación" >> shots/checks.txt
            python3 tap.py has "Zoom automático" >> shots/checks.txt
            adb shell input swipe 540 1800 540 700 400
            sleep 1
            adb shell input swipe 540 1800 540 700 400
            sleep 1
            python3 tap.py shot shots/f-ajustes-acerca.png
            python3 tap.py has "Acerca de MapaNC" >> shots/checks.txt
            python3 tap.py has "OpenStreetMap" >> shots/checks.txt
            python3 tap.py has "Borrar la caché del mapa" >> shots/checks.txt
            python3 tap.py text "← Mapa"
            sleep 2
            adb logcat -d > shots/logcat.txt || true
            grep -c "FATAL EXCEPTION" shots/logcat.txt > shots/fatales.txt || echo "0" > shots/fatales.txt
            adb shell pidof "${{ inputs.paquete }}" > shots/pid.txt || echo "SIN_PROCESO" > shots/pid.txt

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-mensajero-050b
          path: shots/
          if-no-files-found: warn
