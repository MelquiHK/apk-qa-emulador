name: Probar Mensajero en emulador

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL publica del APK a probar"
        required: true
      paquete:
        description: "Package de la app"
        required: true
        default: "com.neocharge.mensajero"
      actividad:
        description: "Actividad principal"
        required: true
        default: ".MainActivity"

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "SIN /dev/kvm"

      - name: Traer tap.py del repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tap.py
          sparse-checkout-cone-mode: false

      - name: Bajar el APK
        run: |
          curl -L -o app.apk "${{ inputs.apk_url }}"
          ls -la app.apk
          /usr/local/lib/android/sdk/build-tools/*/aapt dump badging app.apk 2>/dev/null | head -3 || ls /usr/local/lib/android/sdk/build-tools/ || true

      - name: Correr la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            mkdir -p shots
            echo "== INSTALAR ==" > shots/checks.txt
            adb install -r app.apk 2>&1 | tee shots/instalacion.txt
            adb shell pm grant "${{ inputs.paquete }}" android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant "${{ inputs.paquete }}" android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant "${{ inputs.paquete }}" android.permission.POST_NOTIFICATIONS || true
            adb emu geo fix -82.39116 23.13474
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 18
            python3 tap.py shot shots/01-login.png
            echo "== PANTALLA DE ENTRADA ==" >> shots/checks.txt
            python3 tap.py has "MapaNC" >> shots/checks.txt
            python3 tap.py has "Entrar con Google" >> shots/checks.txt
            python3 tap.py has "NeoCharge Mensajero" >> shots/checks.txt
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "mensajero.prueba@neocharge.cu"
            sleep 1
            python3 tap.py edit 1
            sleep 1
            python3 tap.py type "NeoPrueba-f89168-26"
            sleep 1
            python3 tap.py text "Entrar"
            sleep 15
            python3 tap.py shot shots/02-dentro.png
            echo "== TRAS LOGIN ==" >> shots/checks.txt
            python3 tap.py has "Mis entregas de hoy" >> shots/checks.txt
            python3 tap.py has "PRUEBA QA" >> shots/checks.txt
            adb shell am force-stop "${{ inputs.paquete }}"
            sleep 3
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 15
            python3 tap.py shot shots/03-reapertura.png
            echo "== REAPERTURA (SESION GUARDADA) ==" >> shots/checks.txt
            python3 tap.py has "Mis entregas de hoy" >> shots/checks.txt
            python3 tap.py has "Entra con tu cuenta" >> shots/checks.txt
            echo "== BUSQUEDA 1: d entre 21 y 23 ==" >> shots/checks.txt
            adb shell input swipe 540 1700 540 800 350
            adb shell input swipe 540 1700 540 800 350
            sleep 1
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "d entre 21 y 23"
            sleep 1
            python3 tap.py text "Buscar"
            sleep 6
            python3 tap.py shot shots/04-busqueda-d.png
            python3 tap.py has "callejero de La Habana" >> shots/checks.txt
            python3 tap.py has "Calle D entre 21 y 23" >> shots/checks.txt
            python3 tap.py has "No encontré esa dirección" >> shots/checks.txt
            python3 tap.py text "Mapa"
            sleep 8
            python3 tap.py shot shots/05-busqueda-mapa.png
            python3 tap.py text "Cerrar"
            sleep 2
            adb shell am force-stop "${{ inputs.paquete }}"
            sleep 3
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 12
            echo "== BUSQUEDA 2: 23 entre D y E ==" >> shots/checks.txt
            adb shell input swipe 540 1700 540 800 350
            adb shell input swipe 540 1700 540 800 350
            sleep 1
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "23 entre D y E"
            sleep 1
            python3 tap.py text "Buscar"
            sleep 6
            python3 tap.py shot shots/06-busqueda-23.png
            python3 tap.py has "Calle 23 entre D y E" >> shots/checks.txt
            python3 tap.py has "No encontré esa dirección" >> shots/checks.txt
            adb shell am force-stop "${{ inputs.paquete }}"
            sleep 3
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}"
            sleep 12
            echo "== BUSQUEDA 3: enlace pegado ==" >> shots/checks.txt
            adb shell input swipe 540 1700 540 800 350
            adb shell input swipe 540 1700 540 800 350
            sleep 1
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "https://maps.google.com/?q=23.13550,-82.39250"
            sleep 1
            python3 tap.py text "Buscar"
            sleep 6
            python3 tap.py shot shots/07-busqueda-enlace.png
            python3 tap.py has "Ver en el mapa" >> shots/checks.txt
            python3 tap.py has "No encontré esa dirección" >> shots/checks.txt
            echo "== MAPA COMPLETO ==" >> shots/checks.txt
            adb shell input swipe 540 1700 540 800 350
            adb shell input swipe 540 1700 540 800 350
            adb shell input swipe 540 1700 540 800 350
            sleep 1
            python3 tap.py text "Ver el mapa de La Habana"
            sleep 12
            python3 tap.py shot shots/08-mapa.png
            python3 tap.py has "Mapa de La Habana" >> shots/checks.txt
            python3 tap.py text "Cerrar"
            sleep 2
            echo "== ENTREGA ==" >> shots/checks.txt
            adb shell input swipe 540 800 540 1700 350
            adb shell input swipe 540 800 540 1700 350
            adb shell input swipe 540 800 540 1700 350
            adb shell input swipe 540 800 540 1700 350
            sleep 1
            python3 tap.py desc "Actualizar"
            sleep 5
            python3 tap.py shot shots/09-pedidos.png
            python3 tap.py switch
            sleep 2
            python3 tap.py shot shots/09b-repartiendo.png
            python3 tap.py text "Salí"
            sleep 10
            python3 tap.py shot shots/10-sali.png
            python3 tap.py has "En camino" >> shots/checks.txt
            echo "== SIN INTERNET (COLA) ==" >> shots/checks.txt
            adb shell cmd connectivity airplane-mode enable || true
            sleep 3
            adb emu geo fix -82.39350 23.13680
            sleep 22
            python3 tap.py shot shots/11-offline.png
            python3 tap.py has "pings en cola" >> shots/checks.txt
            adb shell cmd connectivity airplane-mode disable || true
            sleep 25
            python3 tap.py shot shots/11b-online.png
            python3 tap.py has "pings en cola" >> shots/checks.txt
            echo "== CERCA ==" >> shots/checks.txt
            adb emu geo fix -82.39550 23.13850
            sleep 25
            python3 tap.py desc "Actualizar"
            sleep 4
            python3 tap.py shot shots/12-cerca.png
            python3 tap.py has "Estás cerca" >> shots/checks.txt
            echo "== FOTO (MEJOR ESFUERZO) ==" >> shots/checks.txt
            python3 tap.py textpart "Foto de entrega"
            sleep 6
            python3 tap.py shot shots/13-camara.png
            python3 tap.py desc "Take photo"
            sleep 3
            python3 tap.py desc "Done"
            sleep 2
            python3 tap.py text "Done"
            sleep 3
            python3 tap.py shot shots/13b-foto.png
            adb shell input keyevent 4
            sleep 2
            echo "== ENTREGAR ==" >> shots/checks.txt
            python3 tap.py textpart "Marcar entregado"
            sleep 10
            python3 tap.py shot shots/14-entregado.png
            python3 tap.py has "entregas hechas hoy" >> shots/checks.txt
            python3 tap.py has "En camino" >> shots/checks.txt
            echo "== CERRAR EL DIA ==" >> shots/checks.txt
            adb shell input swipe 540 1700 540 800 350
            adb shell input swipe 540 1700 540 800 350
            sleep 1
            python3 tap.py text "Cerrar el día"
            sleep 6
            python3 tap.py shot shots/15-cierre.png
            python3 tap.py has "Día cerrado" >> shots/checks.txt
            echo "== SALIR Y REENTRAR ==" >> shots/checks.txt
            adb shell input swipe 540 1700 540 800 350
            adb shell input swipe 540 1700 540 800 350
            adb shell input swipe 540 1700 540 800 350
            sleep 1
            python3 tap.py text "Salir de la cuenta"
            sleep 5
            python3 tap.py shot shots/16-login2.png
            python3 tap.py has "Entra con tu cuenta" >> shots/checks.txt
            python3 tap.py edit 0
            sleep 1
            python3 tap.py type "mensajero.prueba@neocharge.cu"
            sleep 1
            python3 tap.py edit 1
            sleep 1
            python3 tap.py type "NeoPrueba-f89168-26"
            sleep 1
            python3 tap.py text "Entrar"
            sleep 15
            python3 tap.py shot shots/17-relogin.png
            python3 tap.py has "Mis entregas de hoy" >> shots/checks.txt
            adb logcat -d > shots/logcat.txt || true
            grep -c "FATAL EXCEPTION" shots/logcat.txt > shots/fatales.txt || echo "0" > shots/fatales.txt
            adb shell pidof "${{ inputs.paquete }}" > shots/pid.txt || echo "SIN_PROCESO" > shots/pid.txt

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-mensajero
          path: shots/
          if-no-files-found: warn
