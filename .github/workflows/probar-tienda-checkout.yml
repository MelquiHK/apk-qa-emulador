name: Verificacion Checkout Tienda (pedido completo + ruta en el mapa)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL publica del APK a probar"
        required: true
        default: "https://tienda-neocharge.vercel.app/descargas/neocharge-tienda.apk"
      paquete:
        description: "Package de la app"
        required: true
        default: "com.neocharge.tienda"
      actividad:
        description: "Actividad principal"
        required: true
        default: ".MainActivity"

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "SIN /dev/kvm"

      - name: Bajar el APK
        run: |
          curl -L -o app.apk "${{ inputs.apk_url }}"
          ls -la app.apk
          md5sum app.apk | tee md5.txt

      - name: Flujo de compra completo en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            mkdir -p shots
            cp md5.txt shots/ || true
            adb install -r app.apk 2>&1 | tee shots/instalacion.txt
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}" || adb shell monkey -p "${{ inputs.paquete }}" -c android.intent.category.LAUNCHER 1
            sleep 18
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui.xml'],capture_output=True); xml=open('shots/ui.xml',encoding='utf-8').read() if os.path.exists('shots/ui.xml') else ''; m=re.search(r'text=.Wait.[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml) if 'responding' in xml else None; print('ANR Wait ->',m.groups() if m else None,flush=True); subprocess.run(['adb','shell','input','tap',str((int(m.group(1))+int(m.group(3)))//2),str((int(m.group(2))+int(m.group(4)))//2)]) if m else None" || true
            sleep 2
            adb exec-out screencap -p > shots/01-inicio.png || true
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui.xml'],capture_output=True); xml=open('shots/ui.xml',encoding='utf-8').read() if os.path.exists('shots/ui.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Tienda.[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=max(ms,key=lambda p:p[1]) if ms else None; print('tab Tienda ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else None" || true
            sleep 6
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-tienda.xml > /dev/null 2>&1 || true
            python3 -c "import re,subprocess,os; xml=open('shots/ui-tienda.xml',encoding='utf-8').read() if os.path.exists('shots/ui-tienda.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Cargador de[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 300<=p[1]<=2150]; t=ms[0] if ms else None; print('producto ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN PRODUCTO',flush=True)" || true
            sleep 5
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-detalle.xml > /dev/null 2>&1 || true
            grep -q "Agregar al carrito" shots/ui-detalle.xml || adb shell input swipe 540 1700 540 800 300 || true
            sleep 1
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-detalle.xml > /dev/null 2>&1 || true
            adb exec-out screencap -p > shots/02-detalle.png || true
            python3 -c "import re,subprocess,os; xml=open('shots/ui-detalle.xml',encoding='utf-8').read() if os.path.exists('shots/ui-detalle.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Agregar al carrito.[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=ms[0] if ms else None; print('agregar ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN BOTON AGREGAR',flush=True)" || true
            sleep 3
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui.xml'],capture_output=True); xml=open('shots/ui.xml',encoding='utf-8').read() if os.path.exists('shots/ui.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Carrito.[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=max(ms,key=lambda p:p[1]) if ms else None; print('tab Carrito ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else None" || true
            sleep 4
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-carrito.xml > /dev/null 2>&1 || true
            adb exec-out screencap -p > shots/03-carrito.png || true
            python3 -c "import re,subprocess,os; xml=open('shots/ui-carrito.xml',encoding='utf-8').read() if os.path.exists('shots/ui-carrito.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Continuar al pedido.[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; t=ms[0] if ms else None; print('continuar ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN CONTINUAR',flush=True)" || true
            sleep 5
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-checkout.xml > /dev/null 2>&1 || true
            adb exec-out screencap -p > shots/04-checkout.png || true
            python3 -c "import re,subprocess,os; xml=open('shots/ui-checkout.xml',encoding='utf-8').read() if os.path.exists('shots/ui-checkout.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'class=.android.widget.EditText.[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=ms[0] if ms else None; print('campo nombre ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN CAMPO NOMBRE',flush=True)" || true
            sleep 1
            adb shell input text "Prueba%sQA%sNO%sENTREGAR" || true
            sleep 1
            adb shell input keyevent 111 || true
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui2.xml'],capture_output=True); xml=open('shots/ui2.xml',encoding='utf-8').read() if os.path.exists('shots/ui2.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'class=.android.widget.EditText.[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=ms[1] if len(ms)>1 else None; print('campo telefono ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN CAMPO TELEFONO',flush=True)" || true
            sleep 1
            adb shell input text "53123456" || true
            sleep 1
            adb shell input keyevent 111 || true
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui3.xml'],capture_output=True); xml=open('shots/ui3.xml',encoding='utf-8').read() if os.path.exists('shots/ui3.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Elegir en el mapa.[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; t=ms[0] if ms else None; print('elegir mapa ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN ELEGIR MAPA',flush=True)" || true
            sleep 10
            adb exec-out screencap -p > shots/05-picker.png || true
            adb shell input tap 650 1050 || true
            sleep 7
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-picker.xml > /dev/null 2>&1 || true
            grep -c "Recorrido:" shots/ui-picker.xml > shots/ruta.txt || echo "0" > shots/ruta.txt
            grep -o "Recorrido: [^\\\"]*" shots/ui-picker.xml > shots/ruta-texto.txt || echo "SIN RUTA" > shots/ruta-texto.txt
            adb exec-out screencap -p > shots/06-ruta.png || true
            python3 -c "import re,subprocess,os; xml=open('shots/ui-picker.xml',encoding='utf-8').read() if os.path.exists('shots/ui-picker.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Usar esta ubicaci[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; t=ms[0] if ms else None; print('usar ubicacion ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN USAR UBICACION',flush=True)" || true
            sleep 5
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-checkout2.xml > /dev/null 2>&1 || true
            grep -c "Ubicaci" shots/ui-checkout2.xml > shots/ubicacion-marcada.txt || echo "0" > shots/ubicacion-marcada.txt
            adb exec-out screencap -p > shots/07-checkout-ubicacion.png || true
            adb shell input swipe 540 1800 540 700 300 || true
            sleep 1
            adb shell input swipe 540 1800 540 700 300 || true
            sleep 1
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-preconfirm.xml > /dev/null 2>&1 || true
            python3 -c "import re,subprocess,os; xml=open('shots/ui-preconfirm.xml',encoding='utf-8').read() if os.path.exists('shots/ui-preconfirm.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Confirmar pedido[^>]*bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=max(ms,key=lambda p:p[1]) if ms else None; print('confirmar ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN CONFIRMAR',flush=True)" || true
            sleep 12
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-final.xml > /dev/null 2>&1 || true
            grep -c "Pedido recibido" shots/ui-final.xml > shots/exito.txt || echo "0" > shots/exito.txt
            grep -c "kotlinx" shots/ui-final.xml > shots/error-kotlinx-ui.txt || echo "0" > shots/error-kotlinx-ui.txt
            adb exec-out screencap -p > shots/08-resultado.png || true
            adb shell pidof "${{ inputs.paquete }}" > shots/pid.txt || echo "SIN_PROCESO" > shots/pid.txt
            adb logcat -d > shots/logcat.txt || true
            grep -c "FATAL EXCEPTION" shots/logcat.txt > shots/fatales.txt || echo "0" > shots/fatales.txt
            grep -c "overrides final method" shots/logcat.txt > shots/verifyerror.txt || echo "0" > shots/verifyerror.txt
            grep -c "AbstractJsonTreeEncoder" shots/logcat.txt > shots/jsonencoder.txt || echo "0" > shots/jsonencoder.txt

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-tienda-checkout
          path: shots/
          if-no-files-found: warn
