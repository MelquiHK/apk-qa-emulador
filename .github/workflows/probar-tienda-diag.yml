name: Diagnostico Tienda NeoCharge (favoritos + deeplink)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL publica del APK a probar"
        required: true
        default: "https://tienda-neocharge.vercel.app/descargas/neocharge-tienda.apk"
      paquete:
        description: "Package de la app"
        required: true
        default: "com.neocharge.tienda"
      actividad:
        description: "Actividad principal"
        required: true
        default: ".MainActivity"

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "SIN /dev/kvm"

      - name: Bajar el APK
        run: |
          curl -L -o app.apk "${{ inputs.apk_url }}"
          ls -la app.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort | tail -1)
          $AAPT dump badging app.apk | grep -E "package:|sdkVersion" | tee badging.txt

      - name: Correr el diagnostico en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            mkdir -p shots
            cp badging.txt shots/ || true
            adb install -r app.apk 2>&1 | tee shots/instalacion.txt
            adb shell am start -n "${{ inputs.paquete }}/${{ inputs.actividad }}" || adb shell monkey -p "${{ inputs.paquete }}" -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > shots/01-inicio.png || true
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui.xml'],capture_output=True); xml=open('shots/ui.xml',encoding='utf-8').read() if os.path.exists('shots/ui.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Tienda.[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=max(ms,key=lambda p:p[1]) if ms else None; print('tab Tienda ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else None" || true
            sleep 5
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-tienda-antes.xml > /dev/null 2>&1 || true
            grep -c "Agregar a favoritos" shots/ui-tienda-antes.xml > shots/corazones-antes.txt || echo "0" > shots/corazones-antes.txt
            python3 -c "import re,subprocess,os; xml=open('shots/ui-tienda-antes.xml',encoding='utf-8').read() if os.path.exists('shots/ui-tienda-antes.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'content-desc=.Agregar a favoritos.[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=min(ms,key=lambda p:p[1]) if ms else None; print('corazon ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else print('SIN CORAZON',flush=True)" || true
            sleep 3
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-tienda-tras-corazon.xml > /dev/null 2>&1 || true
            grep -c "Quitar de favoritos" shots/ui-tienda-tras-corazon.xml > shots/quitar-tras-toque.txt || echo "0" > shots/quitar-tras-toque.txt
            adb exec-out screencap -p > shots/02-tras-corazon.png || true
            grep -c "Favoritos" shots/ui-tienda-tras-corazon.xml > shots/chip-favoritos.txt || echo "0" > shots/chip-favoritos.txt
            python3 -c "import re,subprocess,os; subprocess.run(['adb','shell','uiautomator','dump','/sdcard/ui.xml'],capture_output=True); subprocess.run(['adb','pull','/sdcard/ui.xml','shots/ui.xml'],capture_output=True); xml=open('shots/ui.xml',encoding='utf-8').read() if os.path.exists('shots/ui.xml') else ''; ms=[((int(a)+int(c))//2,(int(b)+int(d))//2) for a,b,c,d in re.findall(r'text=.Cuenta.[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].', xml)]; ms=[p for p in ms if 0<=p[0]<=1080 and 0<=p[1]<=2400]; t=max(ms,key=lambda p:p[1]) if ms else None; print('tab Cuenta ->',t,flush=True); subprocess.run(['adb','shell','input','tap',str(t[0]),str(t[1])]) if t else None" || true
            sleep 3
            adb shell input swipe 540 1800 540 700 400 || true
            sleep 1
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-cuenta.xml > /dev/null 2>&1 || true
            python3 -c "import re,subprocess,os; xml=open('shots/ui-cuenta.xml',encoding='utf-8').read() if os.path.exists('shots/ui-cuenta.xml') else ''; m=re.search(r'text=.Mis favoritos.[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].', xml); x,y=((int(m.group(1))+int(m.group(3)))//2,(int(m.group(2))+int(m.group(4)))//2) if m else (0,0); print('Mis favoritos ->',x,y,flush=True); subprocess.run(['adb','shell','input','tap',str(x),str(y)]) if m else print('SIN FILA MIS FAVORITOS',flush=True)" || true
            sleep 4
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-favoritos.xml > /dev/null 2>&1 || true
            grep -c "Sin favoritos" shots/ui-favoritos.xml > shots/favoritos-vacio.txt || echo "0" > shots/favoritos-vacio.txt
            adb exec-out screencap -p > shots/03-favoritos.png || true
            adb shell am start -a android.intent.action.VIEW -d "neocharge://auth-callback?code=PRUEBA" "${{ inputs.paquete }}" || true
            sleep 1
            adb exec-out screencap -p > shots/04-deeplink-1s.png || true
            sleep 4
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || true
            adb pull /sdcard/ui.xml shots/ui-deeplink.xml > /dev/null 2>&1 || true
            adb exec-out screencap -p > shots/05-deeplink-5s.png || true
            adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" > shots/foco-deeplink.txt || true
            adb shell pidof "${{ inputs.paquete }}" > shots/pid.txt || echo "SIN_PROCESO" > shots/pid.txt
            adb logcat -d > shots/logcat.txt || true
            grep -c "FATAL EXCEPTION" shots/logcat.txt > shots/fatales.txt || echo "0" > shots/fatales.txt

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-diag
          path: shots/
          if-no-files-found: warn
